{% set name = "pygbif" %}
{% set version = "0.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pygbif-{{ version }}.tar.gz
  sha256: f287fab6a70d5e2f26ce0dc7ad6e3d47113c4c86d40d0b8f631596283d8bbf35

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - requests >2.7
    - requests-cache
    - geojson-rewind
    - geomet
    - appdirs >=1.4.3
    - matplotlib-base

test:
  imports:
    - pygbif
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: http://github.com/gbif/pygbif
  summary: Python client for GBIF
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ocefpaf
